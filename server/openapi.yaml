  # ════════════════════════════════════════════════════════
  # Scan History
  # ════════════════════════════════════════════════════════
  /scan-history:
    get:
      tags: [ScanHistory]
      summary: Get scan history
      description: Returns the current user's recent QR scan history, ordered by most recent first.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Maximum number of entries to return
      responses:
        '200':
          description: List of scan history entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/ScanHistoryEntry'
                  count:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [ScanHistory]
      summary: Record a scan
      description: Records or updates a bin scan. If the bin was previously scanned, updates the timestamp. Automatically trims history to 100 entries.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [binId]
              properties:
                binId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Scan recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [ScanHistory]
      summary: Clear scan history
      description: Deletes all scan history entries for the current user.
      responses:
        '200':
          description: Scan history cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Scan history cleared
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ════════════════════════════════════════════════════════
  # Export / Import
  # ════════════════════════════════════════════════════════
  /locations/{id}/export:
    get:
      tags: [Export]
      summary: Export location as JSON
      description: |
        Returns the location as one JSON document (format version 4). `bins` are the live bins and
        `trashedBins` the trashed ones; photos are embedded as base64. `areas` lists every area, with
        its loose items when it has any, and `unassignedItems` holds loose items in no area. A child
        box carries `parentShortCode`. Private bins are included only for their creator.
        Requires a Plus or Pro plan (not during a trial). Self-hosted instances are not restricted.
        Limited to 5000 bins (422).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: JSON export
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          oneOf:
            - $ref: '#/components/responses/Forbidden'
            - $ref: '#/components/responses/PlanRestricted'
        '422':
          $ref: '#/components/responses/ValidationError'

  /locations/{id}/export/zip:
    get:
      tags: [Export]
      summary: Export location as ZIP
      description: |
        Returns a ZIP archive:
        - `manifest.json`: `format: "openbin-zip"`, `version: 4`, `locationName`, `locationSettings`,
          counts, and the `areas`, `unassignedItems`, `tagColors`, `customFieldDefinitions`,
          `pinnedBins`, `savedViews` and `members` lists (each present only when non-empty)
        - `bins.json`: live bins, shaped like ExportBin, with each photo's `zipPath` instead of `data`
        - `trashed-bins.json`: trashed bins (only when there are some)
        - `photos/`: the image files that `zipPath` refers to
        Requires a Plus or Pro plan (not during a trial). Self-hosted instances are not restricted.
        Limited to 5000 bins (422).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: ZIP file download
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          oneOf:
            - $ref: '#/components/responses/Forbidden'
            - $ref: '#/components/responses/PlanRestricted'
        '422':
          $ref: '#/components/responses/ValidationError'

  /locations/{id}/export/csv:
    get:
      tags: [Export]
      summary: Export location as CSV
      description: |
        One row per item. Columns: `Bin Name,Area,Item,Quantity,Tags`, with tags joined by `; `.
        A bin with no items gets one row with empty Item and Quantity. Loose items have an empty
        Bin Name and the area path in Area (empty for unassigned items). Child boxes appear as
        ordinary rows, without their parent. Trashed bins are not exported. Member role or above.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: CSV file download
          content:
            text/csv:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /locations/{id}/import:
    post:
      tags: [Export]
      summary: Import a JSON export
      description: |
        Imports a JSON export. Accepts `version` 2, 3 or 4, or no version at all; any other value
        gives 422 (the message names `version`). Body limit 50 MB; at most 2000 bins (live and trashed).

        - **merge** (default) adds to existing data. A bin is skipped when a bin with the same
          `shortCode` exists. A loose item is skipped when an item with the same name is already in
          the same area, or when both are unassigned.
        - **replace** (admins only, 403 otherwise) first deletes all bins, items and areas of the
          location, then imports.
        - **Child boxes**: `parentShortCode` must name a top-level box from this import, or an
          existing top-level box in the location that the caller can see. Otherwise the child is
          skipped and counted in `binsSkippedUnresolvedParent`. A live child of a trashed parent is
          imported trashed with it.
        - **Dry run**: `dryRun: true` returns an ImportPreview and writes nothing.
        - Plan limits: an import that would exceed the bin or photo-storage limit gives 403 PLAN_RESTRICTED.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRequest'
      responses:
        '200':
          description: Import result, or a preview when dryRun is true
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ImportResult'
                  - $ref: '#/components/schemas/ImportPreview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          oneOf:
            - $ref: '#/components/responses/Forbidden'
            - $ref: '#/components/responses/PlanRestricted'
        '422':
          $ref: '#/components/responses/ValidationError'

  /locations/{id}/import/csv:
    post:
      tags: [Export]
      summary: Import bins from CSV
      description: |
        Two header formats:
        - Round-trip (matches CSV export): `Bin Name,Area,Item,Quantity,Tags`. Rows with an empty
          Bin Name are loose items: the Area is their area path, and an empty Area means unassigned.
        - One bin per row: `Bin Name,Area,Items,Tags` (the first column may also be called `Name`).

        Max 10 MB file, at most 2000 bins. Send `dryRun=true` to get a CSV preview without writing.
        `mode=replace` is admin only (403 otherwise).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: CSV file (.csv)
                mode:
                  type: string
                  enum: [merge, replace]
                  default: merge
                dryRun:
                  type: string
                  enum: ['true']
                  description: Send "true" to get a preview instead of importing
      responses:
        '200':
          description: Import result, or a preview when dryRun is "true"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CsvImportResult'
                  - $ref: '#/components/schemas/CsvImportPreview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          oneOf:
            - $ref: '#/components/responses/Forbidden'
            - $ref: '#/components/responses/PlanRestricted'
        '422':
          $ref: '#/components/responses/ValidationError'

  /locations/{id}/import/zip:
    post:
      tags: [Export]
      summary: Import from ZIP backup
      description: |
        Imports a ZIP produced by the ZIP export. `manifest.json` must have `format: "openbin-zip"` and
        a `version` of 2, 3 or 4 (or none); `bins.json` is required, `trashed-bins.json` optional.
        Photos are read from the `zipPath` entries. Max 25 MB file, at most 2000 bins. Modes, child
        box rules, loose items and plan limits are the same as for the JSON import. Send the form
        field `dryRun=true` for an ImportPreview.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: ZIP file (.zip)
                mode:
                  type: string
                  enum: [merge, replace]
                  default: merge
                dryRun:
                  type: string
                  enum: ['true']
                  description: Send "true" to get a preview instead of importing
      responses:
        '200':
          description: Import result, or a preview when dryRun is "true"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ImportResult'
                  - $ref: '#/components/schemas/ImportPreview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          oneOf:
            - $ref: '#/components/responses/Forbidden'
            - $ref: '#/components/responses/PlanRestricted'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ════════════════════════════════════════════════════════
  # AI
  # ════════════════════════════════════════════════════════
  /ai/default-prompts:
    get:
      tags: [AI]
      summary: Get default AI prompts
      description: Returns the built-in default prompt strings for all AI features. No authentication required.
      security: []
      responses:
        '200':
          description: Default prompt strings
          content:
            application/json:
              schema:
                type: object
                properties:
                  analysis:
                    type: string
                    description: Default prompt for image analysis
                  command:
                    type: string
                    description: Default prompt for natural language commands
                  query:
                    type: string
                    description: Default prompt for inventory queries
                  structure:
                    type: string
                    description: Default prompt for text/voice item extraction

  /ai/settings:
    get:
      tags: [AI]
      summary: Get AI provider settings
      description: Returns the user's configured AI provider. API key is masked in the response.
      responses:
        '200':
          description: AI settings (or null if not configured)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlanRestricted'
    put:
      tags: [AI]
      summary: Save AI provider settings
      description: |
        Stores AI provider configuration. API key is encrypted at rest when AI_ENCRYPTION_KEY is set.
        Rate limited to 30 per hour. Requires Pro plan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiSettingsRequest'
      responses:
        '200':
          description: Settings saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlanRestricted'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [AI]
      summary: Delete AI provider settings
      responses:
        '200':
          description: Settings removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: AI settings deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlanRestricted'

  /ai/test:
    post:
      tags: [AI]
      summary: Test AI provider connection
      description: Validates that the provided AI credentials work by making a test API call. Requires Pro plan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiTestRequest'
      responses:
        '200':
          description: Connection successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlanRestricted'
        '422':
          description: Connection failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /ai/structure-text:
    post:
      tags: [AI]
      summary: Structure dictated text into items
      description: |
        Sends raw dictated or typed text to the user's configured AI provider,
        which extracts and normalizes it into a clean list of inventory items.
        Handles filler words, quantity normalization, and deduplication.
        Requires Pro plan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  maxLength: 5000
                  description: Raw dictated or typed text describing items
                mode:
                  type: string
                  enum: [items]
                  default: items
                  description: Structuring mode (only 'items' supported currently)
                context:
                  type: object
                  properties:
                    binName:
                      type: string
                      description: Name of the bin for context
                    existingItems:
                      type: array
                      items:
                        type: string
                      description: Items already in the bin (excluded from results)
                locationId:
                  type: string
                  description: Location ID (unused currently, reserved for future use)
      responses:
        '200':
          description: Structured items
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: string
                    description: Extracted and normalized item list
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlanRestricted'
        '422':
          description: Validation error or AI not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'

  /ai/transcribe:
    post:
      summary: Transcribe audio to text
      description: Accepts an audio file and returns transcribed text using the user's configured AI provider. Supports OpenAI (Whisper) and Gemini. Anthropic is not supported.
      tags: [AI]
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio]
              properties:
                audio:
                  type: string
                  format: binary
                  description: Audio file (webm, mp4, ogg, mpeg, wav). Max 10MB.
      responses:
        '200':
          description: Transcription result
          content:
            application/json:
              schema:
                type: object
                required: [text]
                properties:
                  text:
                    type: string
                    description: Transcribed text from audio
        '400':
          description: No audio file or unsupported format
        '402':
          description: AI credits exhausted
        '403':
          description: AI not configured, provider doesn't support transcription, or plan restricted
        '422':
          description: Validation error

  # ════════════════════════════════════════════════════════
  # AI Streaming
  # ════════════════════════════════════════════════════════
  /ai/query/stream:
    post:
      tags: [AI]
      summary: Stream inventory query via SSE
      description: |
        Read-only AI endpoint that streams a natural language answer about inventory
        as Server-Sent Events. Returns structured JSON with matches and answer.
        Requires location membership and Pro plan. Rate limited: 30/hr for JWT, 1000/hr for API keys.
      requestBody:
        required: true
