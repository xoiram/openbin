  # ════════════════════════════════════════════════════════
  # Bins
  # ════════════════════════════════════════════════════════
  /bins:
    post:
      tags: [Bins]
      summary: Create a bin
      description: |
        Creates a new bin with an auto-generated 6-character alphanumeric ID.
        The ID uses a charset excluding ambiguous characters (0/O, 1/l/I).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBinRequest'
      responses:
        '201':
          description: Bin created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bin'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    get:
      tags: [Bins]
      summary: List bins for a location
      description: |
        Returns non-deleted bins, child boxes included (use `top_level=true` to hide them). Supports server-side search, filtering, sorting,
        and optional offset-based pagination.

        When `limit` is provided, responses include a `count` field with the total
        number of matching rows (for building pagination UI). When `limit` is absent,
        all matching bins are returned and `count` equals `results.length` (backward
        compatible).
      parameters:
        - name: location_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          schema:
            type: string
          description: Search across bin name, items, notes, tags, ID, and area name
        - name: tag
          in: query
          schema:
            type: string
          description: Filter by exact tag match (use `tags` for multi-tag)
        - name: tags
          in: query
          schema:
            type: string
          description: Comma-separated tag names. Combined with `tag_mode`.
        - name: tag_mode
          in: query
          schema:
            type: string
            enum: [any, all]
            default: any
          description: When filtering by `tags`, require any or all tags to match
        - name: area_id
          in: query
          schema:
            type: string
          description: "Filter by single area. Use '__unassigned__' for bins with no area. See also `areas`."
        - name: areas
          in: query
          schema:
            type: string
          description: "Comma-separated area IDs. Supports '__unassigned__'. Takes precedence over `area_id`."
        - name: colors
          in: query
          schema:
            type: string
          description: Comma-separated color keys to filter by
        - name: has_items
          in: query
          schema:
            type: string
            enum: ['true']
          description: Only return bins that have at least one item
        - name: has_notes
          in: query
          schema:
            type: string
            enum: ['true']
          description: Only return bins with non-empty notes
        - name: needs_organizing
          in: query
          schema:
            type: string
            enum: ['true']
          description: Filter bins missing tags, area, and items
        - name: parent
          in: query
          schema:
            type: string
            format: uuid
          description: Only the child boxes of this box
        - name: top_level
          in: query
          schema:
            type: string
            enum: ['true']
          description: Only top-level boxes (no parent). `topLevel=true` is accepted as an alias
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, created_at, updated_at, area]
            default: updated_at
        - name: sort_dir
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Page size. When provided, enables pagination and `count` returns total matching rows.
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Number of rows to skip (used with `limit`)
      responses:
        '200':
          description: List of bins
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Bin'
                  count:
                    type: integer
                    description: Total matching rows when paginated, or results.length otherwise
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /bins/trash:
    get:
      tags: [Bins]
      summary: List soft-deleted bins
      description: |
        Returns bins with non-null deleted_at. Auto-purges after the location's configured
        trash_retention_days (default 30). The `location_id` snake_case alias is also
        accepted for backward compatibility.
      parameters:
        - name: locationId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of trashed bins
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Bin'
                  count:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /bins/lookup/{shortCode}:
    get:
      tags: [Bins]
      summary: Look up a bin by short code
      description: Look up a bin by its human-readable short code. Scoped to the authenticated user's locations.
      parameters:
        - name: shortCode
          in: path
          required: true
          schema:
            type: string
            minLength: 4
            maxLength: 8
      responses:
        '200':
          description: Bin found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bin'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /bins/pinned:
    get:
      tags: [Bins]
      summary: List pinned bins for current user
      description: |
        The `location_id` snake_case alias is also accepted for backward compatibility.
      parameters:
        - name: locationId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Pinned bins ordered by position
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Bin'
                  count:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /bins/pinned/reorder:
    put:
      tags: [Bins]
      summary: Reorder pinned bins
      description: |
        The `bin_ids` snake_case alias is also accepted for backward compatibility.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [binIds]
              properties:
                binIds:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: Pins reordered
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /bins/{id}:
    get:
      tags: [Bins]
      summary: Get a single bin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: 6-character alphanumeric bin short code
      responses:
        '200':
          description: Bin details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bin'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Bins]
      summary: Update a bin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: 6-character alphanumeric bin short code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBinRequest'
      responses:
        '200':
          description: Bin updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bin'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Bins]
      summary: Soft-delete a bin
      description: Sets deleted_at timestamp. Bin can be restored from trash.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: 6-character alphanumeric bin short code
      responses:
        '200':
          description: Bin soft-deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Bin deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /bins/{id}/pin:
    post:
      tags: [Bins]
      summary: Pin a bin (idempotent, max 20 per location)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: 6-character alphanumeric bin short code
      responses:
        '200':
          description: Bin pinned
          content:
            application/json:
              schema:
                type: object
                properties:
                  pinned:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Bins]
      summary: Unpin a bin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: 6-character alphanumeric bin short code
      responses:
        '200':
          description: Bin unpinned
          content:
            application/json:
              schema:
                type: object
                properties:
                  pinned:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'

  /bins/{id}/restore:
    post:
      tags: [Bins]
      summary: Restore a soft-deleted bin
      description: |
        Restores the bin together with the child boxes that were trashed with it. A child box
        can't be restored while its parent is still in the trash (422).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: 6-character alphanumeric bin short code
      responses:
        '200':
          description: Bin restored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bin'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /bins/{id}/move:
    post:
      tags: [Bins]
      summary: Move a bin to a different location
      description: |
        Moves a bin from its current location to a target location.
        The user must be a member of both locations.
        The area assignment is cleared since areas are location-scoped.
        A box inside another box can't be moved on its own (422): it moves with its parent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: 6-character alphanumeric bin short code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locationId]
              properties:
                locationId:
                  type: string
                  format: uuid
                  description: Target location ID
      responses:
        '200':
          description: Bin moved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bin'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /bins/{id}/duplicate:
    post:
      tags: [Bins]
      summary: Duplicate a bin
      description: |
        Creates a copy of an existing bin including items, tags, notes, icon, color, area,
        card style, and visibility. Photos are not copied. The new bin gets a fresh auto-generated ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: 6-character alphanumeric bin short code
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 255
                  description: "Custom name for the copy. Defaults to 'Copy of {original name}'."
      responses:
        '201':
          description: Bin duplicated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bin'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /bins/{id}/change-code:
    post:
      summary: Change bin shortcode
      description: |
        Change a bin's shortcode (primary key). If the new code belongs to another bin,
        that bin is permanently deleted. Requires admin role.
      tags: [Bins]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: ID of the bin whose code will change (the survivor)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  pattern: '^[A-Z0-9]{4,8}$'
                  description: New code to adopt
      responses:
        '200':
          description: Bin with updated code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bin'
        '403':
          description: Not admin in one or both locations
        '404':
          description: Target bin not found
        '409':
          description: Conflict (concurrent modification)
        '422':
          description: Invalid code format or same as current code

  /bins/{id}/permanent:
    delete:
      tags: [Bins]
      summary: Permanently delete a bin
      description: Only works on soft-deleted bins. Removes the bin and its photos from storage.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: 6-character alphanumeric bin short code
      responses:
        '200':
          description: Bin permanently deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Bin permanently deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /bins/{id}/photos:
    post:
      tags: [Bins]
      summary: Upload a photo to a bin
      description: Accepts JPEG, PNG, or WebP up to 5MB.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: 6-character alphanumeric bin short code
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo:
                  type: string
                  format: binary
      responses:
        '201':
          description: Photo uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Photo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/QuotaExceeded'
        '422':
          $ref: '#/components/responses/ValidationError'

  /bins/{id}/add-tags:
    put:
      tags: [Bins]
      summary: Add tags to a bin
      description: Merges new tags with existing ones (does not replace).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: 6-character alphanumeric bin short code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddTagsRequest'
      responses:
        '200':
          description: Tags added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bin'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /bins/{id}/items:
    post:
      tags: [Bins]
      summary: Add items to a bin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: 6-character alphanumeric bin short code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    oneOf:
                      - type: string
                      - type: object
                        properties:
                          name:
                            type: string
                          quantity:
                            type: integer
                        required: [name]
      responses:
        '201':
          description: Items added
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/BinItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /bins/{id}/items/{itemId}:
    put:
      tags: [Bins]
      summary: Rename an item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: 6-character alphanumeric bin short code
        - name: itemId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                quantity:
                  type: integer
                  nullable: true
                  description: Optional quantity (null to clear)
      responses:
        '200':
          description: Item updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BinItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Bins]
      summary: Remove a single item from a bin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: 6-character alphanumeric bin short code
        - name: itemId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Item removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /bins/{id}/items/{itemId}/quantity:
    patch:
      tags: [Bins]
      summary: Update item quantity
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: 6-character alphanumeric bin short code
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity:
                  type: integer
                  description: New quantity (0 or negative removes the item)
      responses:
        '200':
          description: Quantity updated or item removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  quantity:
                    type: integer
                  removed:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /bins/{id}/items/reorder:
    put:
      tags: [Bins]
      summary: Reorder items in a bin
      description: |
        The `item_ids` snake_case alias is also accepted for backward compatibility.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: 6-character alphanumeric bin short code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemIds]
              properties:
                itemIds:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: Items reordered
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ════════════════════════════════════════════════════════
  # Item Checkouts
  # ════════════════════════════════════════════════════════
  /bins/{id}/items/{itemId}/checkout:
    post:
      tags: [Bins]
      summary: Check out an item from a bin
      description: |
        Creates an active checkout record for the item. Fails with 409 if the item
        is already checked out. Requires member role or above.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: 6-character alphanumeric bin short code
        - name: itemId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Item checked out
          content:
            application/json:
              schema:
                type: object
                properties:
                  checkout:
                    $ref: '#/components/schemas/ItemCheckout'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Item is already checked out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /bins/{id}/items/{itemId}/return:
    post:
      tags: [Bins]
      summary: Return a checked-out item to a box
      description: |
        Closes the active checkout for an item checked out of this box. Without a body the item
        goes back to this box. Optionally send `targetBinId` to return it to another live box in
        the same location instead. Requires member role or above.
        For loose items and for targets other than a box, use `POST /locations/{locationId}/items/{itemId}/return`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            description: Origin box ID
        - name: itemId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                targetBinId:
                  type: string
                  format: uuid
                  description: Return the item to a different box in the same location (must be visible to the caller)
      responses:
        '200':
          description: Item returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  checkout:
                    $ref: '#/components/schemas/ItemCheckout'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /bins/{id}/checkouts:
    get:
      tags: [Bins]
      summary: List active checkouts for a bin
      description: Returns all items currently checked out from this bin.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: 6-character alphanumeric bin short code
      responses:
        '200':
          description: Active checkouts
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/ItemCheckout'
                        - type: object
                          properties:
                            item_name:
                              type: string
                            checked_out_by_name:
                              type: string
                  count:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /locations/{locationId}/checkouts:
    get:
      tags: [Locations]
      summary: List active checkouts across a location
      description: |
        Returns all items currently checked out from any bin in the location,
        enriched with item name, origin box (name, icon, color) or origin area for loose items.
        Box and area fields are null when they don't apply.
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Active checkouts with context
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/ItemCheckoutWithContext'
                  count:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /locations/{locationId}/checkouts/bulk-return:
    post:
      tags: [Locations]
      summary: Bulk return checked-out items
      description: |
        Closes up to 200 active checkouts in a single transaction. By default each item returns to
        its origin: the box it came from, or the area for a loose item, or unassigned if that place
        is gone. Send exactly one ItemTarget to send all of them to one place (the box or area must
        be in the same location). Checkouts that are missing or already returned are skipped and
        reported in `errors`. Requires member role or above.
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [checkoutIds]
                  properties:
                    checkoutIds:
                      type: array
                      items:
                        type: string
                        format: uuid
                      minItems: 1
                      maxItems: 200
                - $ref: '#/components/schemas/ItemTarget'
      responses:
        '200':
          description: Bulk return result
          content:
            application/json:
              schema:
                type: object
                required: [returned, errors]
                properties:
                  returned:
                    type: integer
                    minimum: 0
                    description: Number of checkouts successfully closed
                  errors:
                    type: array
                    description: Per-checkout failure entries (NOT_FOUND for missing or already-returned IDs)
                    items:
                      $ref: '#/components/schemas/BulkErrorEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Target box or area not found in this location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error (empty or oversized checkoutIds, more than one target, or invalid target)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /locations/{locationId}/items:
    post:
      tags: [Items]
      summary: Create a loose item in an area or unassigned
      description: |
        Creates an item that is not inside a box: in `areaId` when given, otherwise unassigned.
        Items inside boxes are created with `POST /bins/{id}/items`. Requires member role or above
        (viewers can't create items).
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLocationItemRequest'
      responses:
        '201':
          description: Loose item created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /locations/{locationId}/items/{itemId}:
    put:
      tags: [Items]
      summary: Edit a loose item
      description: |
        Renames a loose item or changes its quantity. An item inside a box returns 422: edit it with
        `PUT /bins/{id}/items/{itemId}` instead. Requires member role or above.
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: itemId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLocationItemRequest'
      responses:
        '200':
          description: Item updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  quantity:
                    type: integer
                    nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Items]
      summary: Delete a loose item
      description: |
        Hard-deletes a loose item. An item inside a box returns 422: delete it with
        `DELETE /bins/{id}/items/{itemId}` instead. Requires member role or above.
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: itemId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Item deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /locations/{locationId}/items/{itemId}/checkout:
    post:
      tags: [Items]
      summary: Check out an item (in a box or loose)
      description: |
        Location-scoped version of `POST /bins/{id}/items/{itemId}/checkout`, so it works for loose
        items as well. Records the origin box or area. Fails with 409 if the item is already checked out.
        Requires member role or above.
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: itemId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Item checked out
          content:
            application/json:
              schema:
                type: object
                properties:
                  checkout:
                    $ref: '#/components/schemas/ItemCheckout'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Item is already checked out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /locations/{locationId}/items/{itemId}/return:
    post:
      tags: [Items]
      summary: Return a checked-out item (box, area or unassigned)
      description: |
        Closes the active checkout. Without a body the item goes back to its origin box or area;
        if that place is gone or trashed, it becomes unassigned. Send one ItemTarget to choose the
        place instead. The item only moves when the return place differs from where it is now.
        Requires member role or above.
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: itemId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemTarget'
      responses:
        '200':
          description: Item returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  checkout:
                    $ref: '#/components/schemas/ItemCheckout'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Item not found, not checked out, or target not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /locations/{id}/stats:
    get:
      tags: [Locations]
      summary: Location dashboard counts
      description: Aggregate counts for a location. Any member, viewers included, may read them.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationStats'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # Shopping List
  /bins/{id}/shopping-list:
    post:
      summary: Bulk-add items to shopping list from a bin
      tags: [Shopping List]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [names]
              properties:
                names:
                  type: array
                  items: { type: string }
                  minItems: 1
                  maxItems: 50
      responses:
        '201':
          description: Entries created
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      $ref: '#/components/schemas/ShoppingListEntry'
                  count: { type: integer }
        '422': { description: Validation error }
        '404': { description: Bin not found }

  /locations/{locationId}/shopping-list:
    get:
      summary: List shopping list entries for a location
      tags: [Shopping List]
      parameters:
        - in: path
          name: locationId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/ShoppingListEntry'
                  count: { type: integer }
    post:
      summary: Manually add an entry to the shopping list
      description: |
        Optional origin: `originBinId` (a box the caller can see) or `originAreaId` (an area in the
        location). Send at most one; both give 422. Purchasing the entry re-adds the item to that origin.
      tags: [Shopping List]
      parameters:
        - in: path
          name: locationId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 200 }
                originBinId: { type: string, format: uuid, nullable: true }
                originAreaId: { type: string, format: uuid, nullable: true }
      responses:
        '201':
          description: Entry created
          content:
            application/json:
              schema:
                type: object
                properties:
                  entry:
                    $ref: '#/components/schemas/ShoppingListEntry'
        '404':
          description: Origin box not found
        '422':
          description: Validation error (empty name, both origins given, or origin area not in this location)

  /shopping-list/{id}/purchase:
    post:
      summary: Mark entry as bought — deletes entry and re-adds to its origin box or area
      description: |
        Re-adds the item as a box item (origin box) or as a loose item (origin area). An entry with no
        origin, or whose origin box is trashed or hidden from the caller, is just removed.
      tags: [Shopping List]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Bought
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
                  restored:
                    type: object
                    nullable: true
                    description: Where the item was re-added. Null when the entry had no usable origin
                    properties:
                      binId:
                        type: string
                        format: uuid
                        nullable: true
                        description: Box the item was added to (null for a loose item)
                      areaId:
                        type: string
                        format: uuid
                        nullable: true
                        description: Area the loose item was added to. Null with binId null means unassigned. Only present for area origins
                      itemId: { type: string, format: uuid }
                      name: { type: string }
        '404': { description: Entry not found }

  /shopping-list/{id}:
    delete:
      summary: Remove a shopping list entry without purchase
      tags: [Shopping List]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        '404': { description: Entry not found }

  /bins/{id}/usage:
    get:
      summary: Get usage history for a bin
      tags: [Bins]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Usage rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        date: { type: string, format: date }
                        count: { type: integer }
                  count: { type: integer }
        '404': { description: Bin not found }
    post:
      summary: Record a usage dot for a bin
      tags: [Bins]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trigger]
              properties:
                trigger:
                  type: string
                  enum: [scan, manual]
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  recorded: { type: boolean }
        '200':
          description: Trigger disabled in user preferences; nothing recorded
        '404': { description: Bin not found }
        '422': { description: Invalid trigger value }

  # ════════════════════════════════════════════════════════
  # Photos
  # ════════════════════════════════════════════════════════
  /photos:
    get:
      tags: [Photos]
      summary: List photos for a bin
      parameters:
        - name: bin_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of photos
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Photo'
                  count:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /photos/{id}/file:
    get:
      tags: [Photos]
      summary: Serve a photo file
      description: Returns the binary image file with appropriate content-type and caching headers.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: token
          in: query
          required: false
          schema:
            type: string
          description: JWT token (alternative to Authorization header)
      responses:
        '200':
          description: Photo file
          content:
            image/*:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /photos/{id}/thumb:
    get:
      tags: [Photos]
      summary: Serve photo thumbnail
      description: |
        Returns a WebP thumbnail (600px wide, 70% quality). Generated lazily on first request
        and cached for subsequent requests. Falls back to original file if generation fails.
        Uses immutable 1-year cache headers.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Thumbnail image (WebP)
          content:
            image/webp:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /photos/{id}:
    delete:
      tags: [Photos]
      summary: Delete a photo
      description: Removes the photo record and deletes the file from storage.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Photo deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Photo deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ════════════════════════════════════════════════════════
  # Attachments (on by default; disable with ATTACHMENTS_ENABLED=false)
  # ════════════════════════════════════════════════════════
  /bins/{id}/attachments:
    get:
      tags: [Attachments]
      summary: List attachments on a bin
      description: Returns 404 when `ATTACHMENTS_ENABLED=false` is set on the server.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: 6-character alphanumeric bin short code
      responses:
        '200':
          description: List of attachments
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Attachment'
                  count:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Attachments]
      summary: Upload an attachment to a bin
      description: |
        Accepts common document and archive formats (PDF, plain text, CSV, Markdown, JSON, RTF,
        Microsoft Office, OpenDocument, ZIP, 7z, tar, gzip) up to 5 MB. Images are rejected —
        use the photos endpoints instead. Returns 404 when `ATTACHMENTS_ENABLED=false` is set.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Attachment created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/QuotaExceeded'
        '422':
          $ref: '#/components/responses/ValidationError'

  /attachments/{id}/file:
    get:
      tags: [Attachments]
      summary: Download an attachment
      description: |
        Streams the raw bytes with `Content-Disposition: attachment` (forces download).
        Returns 404 when `ATTACHMENTS_ENABLED=false` is set.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Attachment file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /attachments/{id}:
    delete:
      tags: [Attachments]
      summary: Delete an attachment
      description: |
        Removes the attachment record and deletes the file from storage. Only the uploader
        or a location admin may delete. Returns 404 when `ATTACHMENTS_ENABLED=false` is set.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Attachment deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Attachment deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ════════════════════════════════════════════════════════
  # Tag Colors
  # ════════════════════════════════════════════════════════
  /tag-colors:
    get:
      tags: [TagColors]
      summary: List tag colors for a location
      description: |
        The `location_id` snake_case alias is also accepted for backward compatibility.
      parameters:
        - name: locationId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of tag colors
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/TagColor'
                  count:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [TagColors]
      summary: Upsert a tag color
      description: Creates or updates the color for a tag in a location.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagColorRequest'
      responses:
        '200':
          description: Tag color saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagColor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /tag-colors/{tag}:
    delete:
      tags: [TagColors]
      summary: Delete a tag color
      parameters:
        - name: tag
          in: path
          required: true
          schema:
            type: string
        - name: location_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Tag color removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Tag color removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ════════════════════════════════════════════════════════
  # Tags
  # ════════════════════════════════════════════════════════
  /tags:
    get:
      tags: [Tags]
      summary: List tags with usage counts
      description: |
        Returns all tags used in a location with the number of (non-deleted, visible) bins
        each tag appears on. Supports search, sorting, and pagination.
      parameters:
        - name: location_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          schema:
            type: string
          description: Filter tags by name (case-insensitive substring match)
        - name: sort
          in: query
          schema:
            type: string
            enum: [alpha, count]
            default: alpha
          description: Sort by tag name or usage count
        - name: sort_dir
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 40
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: List of tags with counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        tag:
                          type: string
                        count:
                          type: integer
                          description: Number of bins using this tag
                  count:
                    type: integer
                    description: Total number of matching tags
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /tags/bulk-apply:
    post:
      tags: [Tags]
      summary: Apply AI tag suggestions to bins
      description: |
        Applies tag taxonomy changes and per-bin assignments in a single transaction.
        Supports creating tags, renaming tags, merging tag groups, setting parent-child
        relationships, and adding/removing tags from bins.
        Requires member role or above. Rate limited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locationId, taxonomy, assignments]
              properties:
                locationId:
                  type: string
                  format: uuid
                  description: Location to apply suggestions to
                taxonomy:
                  type: object
                  required: []
                  properties:
                    newTags:
                      type: array
                      items:
                        type: object
                        properties:
                          tag:
                            type: string
                            description: New tag name
                          parent:
                            type: string
                            nullable: true
                            description: Optional parent tag for hierarchy
                      description: Tags to create
                    renames:
                      type: array
                      items:
                        type: object
                        properties:
                          from:
                            type: string
                            description: Current tag name
                          to:
                            type: string
                            description: New tag name
                      description: Tags to rename
                    merges:
                      type: array
                      items:
                        type: object
                        properties:
                          from:
                            type: array
                            items:
                              type: string
                            description: Source tags to merge
                          to:
                            type: string
                            description: Target tag after merge
                      description: Tag groups to merge
                    parents:
                      type: array
                      items:
                        type: object
                        properties:
                          tag:
                            type: string
                            description: Tag name
                          parent:
                            type: string
                            nullable: true
                            description: Parent tag or null
                      description: Parent-child relationships to set
                assignments:
                  type: object
                  properties:
                    add:
                      type: object
                      additionalProperties:
                        type: array
                        items:
                          type: string
                      description: "Map of bin ID to tags to add"
                    remove:
                      type: object
                      additionalProperties:
                        type: array
                        items:
                          type: string
                      description: "Map of bin ID to tags to remove"
      responses:
        '200':
          description: Suggestions applied successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  tagsCreated:
                    type: integer
                    description: Number of tags created
                  tagsRenamed:
                    type: integer
                    description: Number of tags renamed
                  parentsSet:
                    type: integer
                    description: Number of parent relationships set
                  binsAddedTo:
                    type: integer
                    description: Number of bins where tags were added
                  binsRemovedFrom:
                    type: integer
                    description: Number of bins where tags were removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Validation error or parent cycle detected
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - type: object
                    properties:
                      error:
                        type: string
                        enum: [PARENT_CYCLE]
                      message:
                        type: string
        '429':
          $ref: '#/components/responses/RateLimited'

  /tags/bulk-delete:
    post:
      tags: [Tags]
      summary: Bulk-delete tags from all bins in a location
      description: |
        Removes up to N tags (cap configured via `BULK_MAX_SELECTION`, default 200) from every
        bin in a location and deletes their `tag_colors` rows. Any child tags whose `parent_tag`
        pointed at one of the deleted tags have their `parent_tag` cleared (orphaned). Requires
        member role or above.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locationId, tags]
              properties:
                locationId:
                  type: string
                  format: uuid
                tags:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  maxItems: 200
                  description: Tag names to delete
      responses:
        '200':
          description: Tags deleted
          content:
            application/json:
              schema:
                type: object
                required: [tagsDeleted, binsUpdated, orphanedChildren]
                properties:
                  tagsDeleted:
                    type: integer
                    minimum: 0
                  binsUpdated:
                    type: integer
                    minimum: 0
                    description: Number of bins whose tag list changed
                  orphanedChildren:
                    type: integer
                    minimum: 0
                    description: Number of child tags whose parent_tag was cleared
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Validation error, invalid tag name, or selection over cap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tags/bulk-set-parent:
    post:
      tags: [Tags]
      summary: Set the same parent on N tags
      description: |
        Sets `parent_tag` on every selected tag to one parent (or `null` to clear).
        Rejects with `PARENT_CYCLE` if the resulting taxonomy would create a cycle.
        Requires member role or above. Cap configured via `BULK_MAX_SELECTION` (default 200).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locationId, tags, parentTag]
              properties:
                locationId:
                  type: string
                  format: uuid
                tags:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  maxItems: 200
                parentTag:
                  type: string
                  nullable: true
                  description: Parent tag name, or null to clear parent on the selection
      responses:
        '200':
          description: Parents set
          content:
            application/json:
              schema:
                type: object
                required: [tagsUpdated]
                properties:
                  tagsUpdated:
                    type: integer
                    minimum: 0
                    description: Number of tags whose parent_tag actually changed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Validation error, parentTag in selection, or parent cycle detected
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - type: object
                    properties:
                      error:
                        type: string
                        enum: [PARENT_CYCLE]
                      message:
                        type: string

  /tags/bulk-set-color:
    post:
      tags: [Tags]
      summary: Set the same color on N tags
      description: |
        Upserts the same hex color on every selected tag's `tag_colors` row. An empty string
        clears the color (leaving the tag in `tag_colors` with `color = ''`). Requires member
        role or above. Cap configured via `BULK_MAX_SELECTION` (default 200).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locationId, tags, color]
              properties:
                locationId:
                  type: string
                  format: uuid
                tags:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  maxItems: 200
                color:
                  type: string
                  description: Hex color (e.g. `#ff0000` or `#f00`) or empty string to clear
                  pattern: '^(#[0-9a-fA-F]{6}|#[0-9a-fA-F]{3}|)$'
      responses:
        '200':
          description: Colors set
          content:
            application/json:
              schema:
                type: object
                required: [tagsUpdated]
                properties:
                  tagsUpdated:
                    type: integer
                    minimum: 0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Validation error, invalid color format, or selection over cap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tags/bulk-merge:
    post:
      tags: [Tags]
      summary: Merge N source tags into a single target tag
      description: |
        Renames every tag in `fromTags` to `toTag` across all bins in the location, then deletes
        the source `tag_colors` rows. Child tags that pointed at a source tag have their
        `parent_tag` reassigned to `toTag`. `toTag` must not appear in `fromTags`. Requires
        member role or above. Cap configured via `BULK_MAX_SELECTION` (default 200).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locationId, fromTags, toTag]
              properties:
                locationId:
                  type: string
                  format: uuid
                fromTags:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  maxItems: 200
                  description: Source tags to merge away
                toTag:
                  type: string
                  description: Target tag (must not be in fromTags)
      responses:
        '200':
          description: Tags merged
          content:
            application/json:
              schema:
                type: object
                required: [tagsMerged, binsUpdated, childrenReassigned]
                properties:
                  tagsMerged:
                    type: integer
                    minimum: 0
                    description: Number of merge operations applied (currently 1 per call)
                  binsUpdated:
                    type: integer
                    minimum: 0
                    description: Number of bins whose tag list changed
                  childrenReassigned:
                    type: integer
                    minimum: 0
                    description: Number of child tags whose parent_tag was reassigned to toTag
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Validation error, toTag in fromTags, or selection over cap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ════════════════════════════════════════════════════════
  # Items
  # ════════════════════════════════════════════════════════
  /items:
    get:
      tags: [Items]
      summary: Search items across a location
      description: |
        Returns live items the caller can see in a location: items inside visible boxes, plus loose
        items (which are visible to every member). Each row carries its box when it has one and, for
        loose items, its area.

        **Area filters use the effective area.** `area_id=A` returns the items directly in area A
        plus the items inside boxes located in A. `loose=true` narrows the result to items that are
        not in a box, so unassigned loose items are `unassigned=true&loose=true`. `unassigned=true`
        alone also includes items inside boxes that have no area. `area_id` together with
        `unassigned=true` gives 422.
      parameters:
        - name: location_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          schema:
            type: string
          description: Search text, matched against item, box and area names
        - name: area_id
          in: query
          schema:
            type: string
            format: uuid
          description: Items whose effective area is this area. Alias `areaId`
        - name: unassigned
          in: query
          schema:
            type: string
            enum: ['true']
          description: Items with no effective area (unassigned loose items and items in unassigned boxes)
        - name: loose
          in: query
          schema:
            type: string
            enum: ['true']
          description: Only items that are not inside a box
        - name: sort
          in: query
          schema:
            type: string
            enum: [alpha, bin, qty]
            default: alpha
          description: Sort by item name, by box or area name, or by quantity (unset quantities last)
        - name: sort_dir
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 40
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Items, with box and area context
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/ItemListEntry'
                  count:
                    type: integer
                    description: Total number of matching items
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /items/bulk-delete:
    post:
      tags: [Items]
      summary: Bulk soft-delete items
      description: |
        Soft-deletes up to 200 items in a single transaction. Items with `deleted_at IS NULL`
        are filtered out of all read endpoints. Use `/items/bulk-restore` to undo.
        Requires member role or above. All `ids` must belong to bins in the same location
        as the caller's active membership; mixed locations return `VALIDATION_ERROR`.
        The selection cap is configurable via the `BULK_MAX_SELECTION` env var (default 200).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  minItems: 1
                  maxItems: 200
                  description: Item IDs to soft-delete
      responses:
        '200':
          description: Items soft-deleted
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted:
                    type: integer
                    minimum: 0
                    description: Number of items soft-deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Validation error (empty ids, mixed locations, or selection over cap)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /items/bulk-restore:
    post:
      tags: [Items]
      summary: Bulk restore soft-deleted items
      description: |
        Restores up to 200 previously soft-deleted items by clearing `deleted_at`.
        Requires member role or above. All `ids` must belong to bins in the same location.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  minItems: 1
                  maxItems: 200
      responses:
        '200':
          description: Items restored
          content:
            application/json:
              schema:
                type: object
                required: [restored]
                properties:
                  restored:
                    type: integer
                    minimum: 0
                    description: Number of items restored
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Validation error or selection over cap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /items/bulk-checkout:
    post:
      tags: [Items]
      summary: Bulk check out items
      description: |
        Checks out up to 200 items in a single transaction. Items already checked out are
        skipped and reported in the `errors` array (per-item failure reasons). Requires member
        role or above. All `ids` must belong to bins in the same location.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  minItems: 1
                  maxItems: 200
      responses:
        '200':
          description: Bulk checkout result
          content:
            application/json:
              schema:
                type: object
                required: [checkedOut, errors]
                properties:
                  checkedOut:
                    type: integer
                    minimum: 0
                    description: Number of items successfully checked out
                  errors:
                    type: array
                    description: Per-item failure entries (e.g. already checked out)
                    items:
                      $ref: '#/components/schemas/BulkErrorEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Validation error or selection over cap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /items/bulk-move:
    post:
      tags: [Items]
      summary: Bulk move items to a box, an area, or unassigned
      description: |
        Moves up to 200 items in one transaction. The target is exactly one ItemTarget:
        `targetBinId` (a live box the caller can see), `targetAreaId` (an area in the location), or
        `unassigned: true` (no box and no area). Moving into a box appends the items to it. Items from
        other locations are skipped. Requires member role or above. Zero or several targets give 422.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [ids]
                  properties:
                    ids:
                      type: array
                      items:
                        type: string
                        format: uuid
                      minItems: 1
                      maxItems: 200
                - $ref: '#/components/schemas/ItemTarget'
      responses:
        '200':
          description: Items moved
          content:
            application/json:
              schema:
                type: object
                required: [moved]
                properties:
                  moved:
                    type: integer
                    minimum: 0
                    description: Number of items moved
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Validation error (no target or more than one target, mixed locations, or selection over cap)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /items/bulk-quantity:
    post:
      tags: [Items]
      summary: Bulk update item quantities
      description: |
        Bulk-updates quantities for up to 200 items. The `op` field selects the operation:
        - `set` — replace quantity with `value` (required, integer >= 0)
        - `clear` — clear quantity (sets `quantity` to `NULL`); `value` ignored
        - `inc` — add `value` (required, integer) to current quantity
        - `dec` — subtract `value` (required, integer) from current quantity; items whose new
          quantity would reach 0 are removed and counted in `removed`

        Requires member role or above. All `ids` must belong to bins in the same location.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, op]
              properties:
                ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  minItems: 1
                  maxItems: 200
                op:
                  type: string
                  enum: [set, clear, inc, dec]
                  description: Quantity operation to apply
                value:
                  type: integer
                  description: Operand for `set`, `inc`, `dec`. Ignored for `clear`.
      responses:
        '200':
          description: Quantities updated
          content:
            application/json:
              schema:
                type: object
                required: [updated, removed]
                properties:
                  updated:
                    type: integer
                    minimum: 0
                    description: Number of items whose quantity was updated
                  removed:
                    type: integer
                    minimum: 0
                    description: Number of items removed because their quantity hit 0 (only for `dec`)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Validation error (invalid op, missing value, mixed locations, or selection over cap)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ════════════════════════════════════════════════════════
  # Print Settings
