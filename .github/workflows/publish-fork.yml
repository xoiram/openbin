name: Publish image (fork)

# Fork-only infra: builds this fork's image and publishes it to GHCR under
# this repo owner's namespace. Pushes to main auto-build the selfhosted
# edition as ghcr.io/<owner>/openbin:edge; workflow_dispatch remains for
# on-demand builds (custom tag, or the cloud/EE edition). Not part of
# upstream's release process (docker-publish.yml pushes to akifbayram's own
# registry + DockerHub, and its deploy job depends on secrets that don't
# exist on a fork) — this is fork-only infra and shouldn't be carried into
# an eventual upstream PR.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish'
        required: false
        default: 'dev'
      edition:
        description: 'Build edition'
        required: false
        default: 'selfhosted'
        type: choice
        options:
          - selfhosted
          - cloud

jobs:
  docker-build:
    if: github.repository != 'akifbayram/openbin'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute image namespace
        run: echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute build params
        id: params
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            edition="${{ inputs.edition }}"
            tag="${{ inputs.tag }}"
          else
            edition="selfhosted"
            tag="edge"
          fi
          pkg_version=$(node -p "require('./package.json').version")
          echo "edition=${edition}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${pkg_version}-${edition}.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/openbin:${{ steps.params.outputs.tag }}
          build-args: |
            BUILD_EDITION=${{ steps.params.outputs.edition }}
            BUILD_VERSION=${{ steps.params.outputs.version }}
            APK_UPGRADE_BUST=${{ github.run_id }}
          cache-from: type=gha,scope=fork-${{ steps.params.outputs.edition }}
          cache-to: type=gha,mode=max,scope=fork-${{ steps.params.outputs.edition }}
