name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Lint, type checks, client tests and both builds. ~2 min; the server tests (the slow
  # part, ~6 min on one runner) run in parallel as the `test-server` shards below.
  quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install client dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Lint (client)
        run: npx biome check src/

      - name: Lint (server)
        run: npx biome check src/
        working-directory: server

      - name: Type check (client)
        run: npx tsc --noEmit

      - name: i18n lint (missing/unused translation keys)
        run: npx i18next-cli lint

      - name: Type check (server)
        run: npx tsc --noEmit
        working-directory: server

      - name: Test (client)
        run: npx vitest run

      - name: Build client
        run: npx vite build

      - name: Build server
        run: npm run build
        working-directory: server

  # Server unit tests (SQLite) split across 4 runners. Vitest assigns each test file to a
  # shard by a hash of its path and gives every shard the same number of files; with no
  # file over ~25 s that splits the work to within ~10% of even. If you change the shard
  # count, change both the matrix and the `/4` below.
  test-server:
    name: test-server (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Test (server, shard ${{ matrix.shard }}/4)
        run: npx vitest run --shard=${{ matrix.shard }}/4
        working-directory: server

  # Single required-looking status for the whole pipeline: keeps the `check` name that
  # PR tooling (and Renovate's automerge) already watch, and fails if any job above did.
  check:
    needs: [quick, test-server]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        env:
          QUICK: ${{ needs.quick.result }}
          TEST_SERVER: ${{ needs.test-server.result }}
        run: |
          echo "quick: $QUICK, test-server: $TEST_SERVER"
          [ "$QUICK" = "success" ] && [ "$TEST_SERVER" = "success" ]

  # Server unit tests run on SQLite only. This job runs the tests that need a real
  # PostgreSQL (migrations, schema parity): `npm run test:postgres` in server/.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: openbin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/openbin_test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Postgres migration tests
        run: npm run test:postgres
        working-directory: server
