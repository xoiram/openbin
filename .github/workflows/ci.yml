name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install client dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Lint (client)
        run: npx biome check src/

      - name: Lint (server)
        run: npx biome check src/
        working-directory: server

      - name: Type check (client)
        run: npx tsc --noEmit

      - name: i18n lint (missing/unused translation keys)
        run: npx i18next-cli lint

      - name: Type check (server)
        run: npx tsc --noEmit
        working-directory: server

      - name: Test (client)
        run: npx vitest run

      - name: Test (server)
        run: npx vitest run
        working-directory: server

      - name: Build client
        run: npx vite build

      - name: Build server
        run: npm run build
        working-directory: server

  # Server unit tests run on SQLite only. This job runs the tests that need a real
  # PostgreSQL (migrations, schema parity): `npm run test:postgres` in server/.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: openbin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/openbin_test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Postgres migration tests
        run: npm run test:postgres
        working-directory: server
