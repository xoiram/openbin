name: Publish PR preview image (fork)

# Fork-only infra: builds the selfhosted edition of a pull request and pushes
# it to GHCR as ghcr.io/<owner>/openbin-preview:pr-<number>.
#
# These images are throwaway test builds, not releases. They deliberately live
# in a separate package (openbin-preview, not openbin) and use pr-<number> tags,
# so nothing that tracks openbin:edge/latest (deploys, Renovate, Dependabot)
# can mistake them for a release. Each image carries the OCI labels
# openbin.preview=true and openbin.pr=<number>.
#
# Only PRs from branches in this repo run it: fork PRs get a read-only token.

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview-image:
    if: >-
      github.repository != 'akifbayram/openbin' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Compute image name
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/openbin-preview" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:pr-${{ github.event.pull_request.number }}
            ${{ env.IMAGE }}:pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          labels: |
            openbin.preview=true
            openbin.pr=${{ github.event.pull_request.number }}
            org.opencontainers.image.title=OpenBin PR preview (not a release)
            org.opencontainers.image.description=Test build of PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.head.ref }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}
          build-args: |
            BUILD_EDITION=selfhosted
            BUILD_VERSION=pr-${{ github.event.pull_request.number }}.${{ github.event.pull_request.head.sha }}
            APK_UPGRADE_BUST=${{ github.run_id }}
          cache-from: type=gha,scope=fork-selfhosted
          cache-to: type=gha,mode=max,scope=pr-preview
